<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tùy chỉnh nút thêm giỏ hàng</title>
<style>body{margin:0;background:#fff7fa;color:#402531;font:16px/1.6 system-ui}main{max-width:600px;margin:60px auto;padding:32px;background:white;border:1px solid #edcfdb;border-radius:16px}h1{font:32px Georgia;margin-top:0}.preview{display:grid;place-items:center;background:#f9eef3;border-radius:12px;padding:35px;margin:24px 0}.preview img{width:64px;height:64px;object-fit:contain}button{padding:12px 18px;border:1px solid #b86b90;border-radius:8px;background:#f4d6e3;color:#402531;cursor:pointer;margin:16px 8px 0 0}input{max-width:100%}a{color:#8d365d}#status{min-height:30px}@media(max-width:640px){main{margin:16px;padding:24px}}</style></head>
<body><main><a href="/">← Về cửa hàng</a><h1>Nút thêm giỏ hàng</h1><p>Thay ảnh dấu cộng theo màu bộ sưu tập. Ảnh áp dụng cho các nút thêm giỏ nhanh trên toàn bộ bản website cục bộ.</p><p>Dùng PNG nền trong suốt, JPG hoặc WebP, tối đa 2 MB. Nên dùng ảnh vuông, sắc nét.</p><div class="preview"><img id="preview" alt="Ảnh nút thêm giỏ hàng" src="/assets/custom/quick-add.svg"></div><label for="file">Chọn ảnh nút mới</label><p><input id="file" type="file" accept="image/png,image/jpeg,image/webp"></p><button id="save" disabled>Lưu ảnh</button><button id="reset">Dùng nút mặc định</button><p id="status" role="status"></p></main><script>
const file=document.querySelector('#file'),preview=document.querySelector('#preview'),save=document.querySelector('#save'),status=document.querySelector('#status');let image='';
fetch('/__local/settings').then(r=>r.json()).then(s=>preview.src=s.plusButtonImage);
file.addEventListener('change',()=>{const f=file.files[0];if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type)||f.size>2*1024*1024){status.textContent='Chọn ảnh PNG/JPG/WebP không quá 2 MB.';save.disabled=true;return;}const reader=new FileReader();reader.onload=()=>{image=reader.result;preview.src=image;save.disabled=false;status.textContent='Ảnh mới đang được xem thử. Bấm Lưu ảnh để áp dụng.';};reader.readAsDataURL(f);});
async function update(data){save.disabled=true;try{const r=await fetch('/__local/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const s=await r.json();if(!r.ok)throw Error(s.error);preview.src=s.plusButtonImage;status.textContent='Đã lưu. Tải lại trang cửa hàng để thấy nút mới.';}catch(e){status.textContent=e.message;save.disabled=!image;}}
save.onclick=()=>update({image});document.querySelector('#reset').onclick=()=>{image='';file.value='';update({reset:true});};
</script></body></html>
